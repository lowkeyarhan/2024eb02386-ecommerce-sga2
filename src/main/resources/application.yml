server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: ecommerce-order-inventory
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecommerce_sga2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Kolkata
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

logging:
  level:
    root: INFO
    com.lowkeyarhan.ecommerce: INFO
    org.hibernate.SQL: WARN
